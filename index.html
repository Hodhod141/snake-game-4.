<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic Snake</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #101820; color: #f2f5f7; font: 16px system-ui, sans-serif; }
  .game { text-align: center; padding: 20px; }
  h1 { margin: 0 0 8px; color: #7CFC00; }
  canvas { display: block; margin: 16px auto; background: #07110b;
    border: 3px solid #7CFC00; border-radius: 8px; max-width: 100%; }
  button { padding: 10px 18px; border: 0; border-radius: 8px;
    background: #7CFC00; color: #101820; font-weight: bold; cursor: pointer; }
  .hint { color: #b8c5cc; font-size: 14px; }
</style>
</head>
<body>
<div class="game">
  <h1>🐍 Snake</h1>
  <div>Score: <span id="score">0</span></div>
  <canvas id="board" width="400" height="400"></canvas>
  <button id="restart">Start / Restart</button>
  <p class="hint">Move with arrow keys or WASD. Eat the red food. Don't hit walls or yourself!</p>
  <p id="status">Press Start to play.</p>
</div>
<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const size = 20, cells = canvas.width / size;
let snake, food, direction, nextDirection, score, timer, running;

function reset() {
  clearInterval(timer);
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  direction = {x: 1, y: 0};
  nextDirection = {x: 1, y: 0};
  score = 0; running = false;
  document.getElementById("score").textContent = score;
  document.getElementById("status").textContent = "Press Start to play.";
  placeFood(); draw();
}
function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells)};
  } while (snake.some(part => part.x === food.x && part.y === food.y));
}
function start() {
  reset(); running = true;
  document.getElementById("status").textContent = "Good luck!";
  timer = setInterval(tick, 110);
}
function tick() {
  direction = nextDirection;
  const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
  const eating = head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0, -1);
  if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells ||
      body.some(part => part.x === head.x && part.y === head.y)) {
    clearInterval(timer); running = false;
    document.getElementById("status").textContent = "Game over! Press Start to try again.";
    return;
  }
  snake.unshift(head);
  if (eating) {
    score += 10;
    document.getElementById("score").textContent = score;
    placeFood();
  } else snake.pop();
  draw();
}
function draw() {
  ctx.fillStyle = "#07110b"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#ff4d4d";
  ctx.beginPath(); ctx.arc(food.x*size+size/2, food.y*size+size/2, size/2-2, 0, Math.PI*2); ctx.fill();
  snake.forEach((part, i) => {
    ctx.fillStyle = i === 0 ? "#b5ff66" : "#7CFC00";
    ctx.fillRect(part.x*size+1, part.y*size+1, size-2, size-2);
  });
}
document.addEventListener("keydown", e => {
  const keys = {
    ArrowUp:{x:0,y:-1}, w:{x:0,y:-1}, ArrowDown:{x:0,y:1}, s:{x:0,y:1},
    ArrowLeft:{x:-1,y:0}, a:{x:-1,y:0}, ArrowRight:{x:1,y:0}, d:{x:1,y:0}
  };
  const move = keys[e.key] || keys[e.key.toLowerCase()];
  if (!move) return;
  e.preventDefault();
  if (move.x !== -direction.x || move.y !== -direction.y) nextDirection = move;
});
document.getElementById("restart").addEventListener("click", start);
reset();
</script>
</body>
</html>
